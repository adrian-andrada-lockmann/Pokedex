<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/styles.css">
  <title>Retro Dex Terminal by Adrian Andrada Lockmann</title>
</head>

<body>
  <main class="dex-shell" aria-label="Retro Dex Terminal">
    <section class="dex-header">
      <div>
        <p class="eyebrow">Trainer Field Unit</p>
        <h1>Retro Dex Terminal</h1>
      </div>
      <div class="status-strip" aria-label="Terminal status">
        <span class="status-light red"></span>
        <span class="status-light amber"></span>
        <span class="status-light green"></span>
        <span id="total-pokemones">SYNCING POKEAPI</span>
      </div>
    </section>

    <section class="dex-console">
      <aside class="dex-panel nav-panel" aria-label="Pokemon navigation">
        <div class="panel-title">
          <span>Index</span>
          <strong id="page-label">01</strong>
        </div>

        <label class="field-label" for="search-input">Search name or ID</label>
        <input id="search-input" class="terminal-input" type="search" autocomplete="off" placeholder="pikachu / 25">

        <label class="field-label" for="type-filter">Type filter</label>
        <select id="type-filter" class="terminal-input">
          <option value="">All types</option>
        </select>

        <div class="button-grid" aria-label="Pagination controls">
          <button id="prev-page" class="control-button" type="button">PREV</button>
          <button id="next-page" class="control-button" type="button">NEXT</button>
        </div>

        <div id="indice" class="pokemon-list" aria-live="polite">
          <p class="terminal-note">Loading index...</p>
        </div>
      </aside>

      <section class="dex-screen" aria-label="Selected Pokemon">
        <div class="screen-glass">
          <div class="screen-topline">
            <span id="ayuda">Booting scanner...</span>
            <button id="favorite-toggle" class="icon-button" type="button" aria-label="Toggle favorite">☆</button>
          </div>

          <div class="pokemon-stage">
            <div class="scan-ring" aria-hidden="true"></div>
            <img id="pokemon-imagen" alt="">
          </div>

          <div class="identity-row">
            <span id="pokemon-id">#000</span>
            <h2 id="pokemon-nombre">Unknown</h2>
          </div>

          <div class="meta-grid">
            <div>
              <span class="field-label">Type</span>
              <div id="tipos" class="chip-row"></div>
            </div>
            <div>
              <span class="field-label">Abilities</span>
              <div id="habilidades" class="chip-row"></div>
            </div>
          </div>

          <div id="stats" class="stats-grid" aria-label="Base stats"></div>
        </div>
      </section>

      <aside class="dex-panel data-panel" aria-label="Pokemon data">
        <div class="panel-title">
          <span>Field Data</span>
          <strong id="selected-code">NO TARGET</strong>
        </div>

        <section class="mini-module">
          <div class="module-header">
            <h3>Team Tray</h3>
            <span id="team-count">0/6</span>
          </div>
          <div id="team-tray" class="team-tray"></div>
          <button id="add-team" class="wide-button" type="button">Add selected to team</button>
        </section>

        <section class="mini-module">
          <div class="module-header">
            <h3>Compare</h3>
            <span>2 slots</span>
          </div>
          <div class="button-grid">
            <button id="compare-a" class="control-button" type="button">Set A</button>
            <button id="compare-b" class="control-button" type="button">Set B</button>
          </div>
          <div id="compare-panel" class="compare-panel"></div>
        </section>

        <section class="mini-module moves-module">
          <div class="module-header">
            <h3>Move Log</h3>
            <span id="moves-count">0</span>
          </div>
          <div id="movimientos" class="moves-list"></div>
        </section>
      </aside>
    </section>
  </main>

  <script src="src/Pokedex.js"></script>
</body>

</html>
